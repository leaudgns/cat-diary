<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">냥이 프로필</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="profile-back" href="index.html">← 홈</a>
    <a class="profile-links" id="otherCatLink" href="cat2.html">다른 냥이 보기 →</a>
  </div>
</header>

<main>
  <div class="profile-hero">
    <div class="profile-avatar"><img id="profileAvatar" alt=""></div>
    <div>
      <h2 id="profileName">냥이</h2>
      <p class="profile-since" id="profileSince">불러오는 중...</p>
    </div>
  </div>

  <div class="info-card">
    <div class="info-card-header">
      <h3>기본 정보</h3>
      <button class="info-edit-btn" id="infoEditBtn">✎ 수정</button>
    </div>
    <div class="info-grid" id="infoGrid"></div>
  </div>

  <div class="section-card">
    <h3>몸무게</h3>
    <div class="weight-chart-wrap" id="weightChartWrap"></div>
    <form id="weightForm" class="simple-form">
      <input type="number" id="weightKg" step="0.01" min="0" placeholder="kg" required>
      <input type="date" id="weightDate">
      <input type="text" id="weightMemo" placeholder="메모 (선택)">
      <button type="submit">기록</button>
    </form>
    <div class="log-list" id="weightList"></div>
  </div>

  <div class="section-card">
    <h3>음수량 &amp; 칼로리 계산기</h3>
    <p class="calc-note" id="calcWeightNote"></p>
    <div class="simple-form">
      <input type="number" id="calcWeight" step="0.01" min="0" placeholder="몸무게 (kg)">
      <select id="calcActivity">
        <option value="1.0">다이어트 중</option>
        <option value="1.2" selected>중성화한 성묘 (보통 활동)</option>
        <option value="1.4">중성화 안 한 성묘</option>
        <option value="1.6">활동적 / 외출묘</option>
        <option value="1.1">노묘 (7살 이상)</option>
        <option value="0.8">비만 관리 중 (감량 목표)</option>
      </select>
      <button type="button" id="calcBtn">계산하기</button>
    </div>
    <div class="calc-result" id="calcResult"></div>
  </div>

  <div class="section-card">
    <h3>놀이 기록</h3>
    <div class="toy-status" id="toyStatus"></div>
    <form id="playForm" class="simple-form">
      <input type="text" id="toyName" placeholder="장난감 이름" required>
      <input type="date" id="playDate">
      <input type="text" id="playMemo" placeholder="메모 (선택)">
      <button type="submit">기록</button>
    </form>
    <div class="log-list" id="playList"></div>
  </div>

  <div class="section-card">
    <h3>화장실 기록</h3>
    <div class="toy-status" id="litterStatus"></div>
    <div class="litter-quick">
      <button type="button" class="litter-quick-btn lq-pee" id="litterQuickPee">
        <span class="lq-emoji">🥔</span><span class="lq-label">감자 (소변)</span><span class="lq-count" id="litterCountPee">0</span>
      </button>
      <button type="button" class="litter-quick-btn lq-poop" id="litterQuickPoop">
        <span class="lq-emoji">🍫</span><span class="lq-label">맛동산 (대변)</span><span class="lq-count" id="litterCountPoop">0</span>
      </button>
    </div>
    <div class="log-list" id="litterList"></div>
  </div>

  <div class="section-card">
    <h3>목욕 관리</h3>
    <div class="toy-status" id="groomStatus_bath"></div>
    <div class="simple-form">
      <button type="button" class="quick-log-btn" id="groomQuickBtn_bath">🛁 오늘 목욕했어요</button>
    </div>
    <form id="groomForm_bath" class="simple-form">
      <input type="date" id="groomDate_bath">
      <input type="text" id="groomMemo_bath" placeholder="메모 (선택)">
      <button type="submit">다른 날짜로 기록</button>
    </form>
    <div class="log-list" id="groomList_bath"></div>
  </div>

  <div class="section-card">
    <h3>발톱 관리</h3>
    <div class="toy-status" id="groomStatus_nail"></div>
    <div class="simple-form">
      <button type="button" class="quick-log-btn" id="groomQuickBtn_nail">💅 오늘 발톱 정리했어요</button>
    </div>
    <form id="groomForm_nail" class="simple-form">
      <input type="date" id="groomDate_nail">
      <input type="text" id="groomMemo_nail" placeholder="메모 (선택)">
      <button type="submit">다른 날짜로 기록</button>
    </form>
    <div class="log-list" id="groomList_nail"></div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script>
  window.CAT_KEY = 'cat1';
  window.OTHER_CAT_PAGE = 'cat2.html';
</script>
<script src="js/profile.js"></script>
</body>
</html>
